<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Search Hub</title>
	<link rel="icon" type="image/x-icon" href="search-hub.ico" />
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="style.css" />
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
	<main class="mx-auto max-w-4xl px-3 py-8 sm:px-4 lg:px-6">
		<header class="mb-6 flex items-center justify-between gap-4">
			<div>
				<h1 class="text-2xl font-bold text-slate-900">Search Hub</h1>
				<p class="mt-1 text-sm text-slate-500">Find anything, anywhere</p>
			</div>
			<div class="hidden sm:flex items-center text-sm text-slate-500">
				<p>Fast Search • Multiple Engines • All in One</p>
			</div>
			<button id="settings-btn" class="settings-button ml-auto sm:ml-0" title="Settings">
				<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
						d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
					</path>
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
						d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
				</svg>
			</button>
		</header>

		<!-- Global single input + favorite services + category sections -->
		<div id="global-search" class="mb-6">
			<div class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
				<div class="px-4 py-5 sm:px-6">
					<label for="global-search-input" class="sr-only">Search input</label>
					<input id="global-search-input" type="search"
						placeholder="Search anything fast, then choose a service"
						class="w-full min-w-0 rounded-full border-4 border-gray-300 px-4 py-4 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-300" />
					<div id="favorite-services" class="mt-4 flex flex-wrap gap-2"></div>
					<hr class="my-5 border-slate-200" />
					<div id="service-categories" class="space-y-4"></div>
				</div>
			</div>
		</div>

		<!-- Settings Modal -->
		<div id="settings-modal" class="settings-modal hidden">
			<div class="settings-modal-overlay"></div>
			<div class="settings-modal-content">
				<div class="flex items-center justify-between border-b border-slate-200 pb-4">
					<h2 class="text-lg font-semibold text-slate-900">Settings</h2>
					<button id="close-modal-btn" class="text-slate-400 hover:text-slate-600">
						<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M6 18L18 6M6 6l12 12"></path>
						</svg>
					</button>
				</div>
				<div class="py-4">
					<label class="block text-sm font-medium text-slate-700 mb-3">Default Search Service</label>
					<div id="modal-service-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
				</div>
			</div>
		</div>
	</main>

	<script src="searchEngineData.js"></script>
	<script src="script.js"></script>
</body>

</html>
